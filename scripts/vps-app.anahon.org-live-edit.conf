# Appended to /etc/nginx/sites-available/app.anahon.online on the VPS (187.77.102.124), 10 Oct 2026.
# Copied back from the live file after nginx -t + reload, so this is what actually runs.
# ---- Live editor from the public door (Saad, 10 Oct 2026: "i want to fix this") ---------------
# app.anahon.org:8443 is the site's DEV server (the only place live-edit.js exists), framed by the
# FMS's Live editor. Same host, different port — exactly how it works on the LAN (3100<->4321) and
# the tailnet (8444<->8443) — so it is cross-origin by construction and production's own
# X-Frame-Options on anahon.org is untouched. Because this port faces the internet, every request
# is checked first: nginx asks the FMS (auth_request) whether the browser holds the signed,
# HttpOnly cookie that /api/website/live-edit/start gives a signed-in website editor, and proxies
# only on 200. Only app.anahon.org may frame it (CSP frame-ancestors); every other origin is refused.
# The dev server's own write endpoints (/__build, /__article, ...) are refused here: the FMS calls
# them over the LAN after its own gates (roles, the P3 §8 correction rule), and they must not be
# reachable around those gates. Tracked copy: system/scripts/vps-app.anahon.org-live-edit.conf.

map $http_upgrade $live_edit_conn { default upgrade; '' ''; }

upstream site_edit {
    server 100.91.229.30:4321;    # anahon-1's Astro dev server, over the tailnet
    keepalive 4;
}

server {
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;
    server_name app.anahon.org;
    ssl_certificate     /etc/letsencrypt/live/app.anahon.online/fullchain.pem;   # SAN covers app.anahon.org
    ssl_certificate_key /etc/letsencrypt/live/app.anahon.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    server_tokens off;

    add_header Content-Security-Policy "frame-ancestors https://app.anahon.org" always;
    limit_conn_status 429;
    limit_conn fms_conn 200;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade           $http_upgrade;     # Vite's HMR websocket
    proxy_set_header Connection        $live_edit_conn;

    location = /__live_edit_auth {
        internal;
        proxy_pass http://fms/api/website/live-edit/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Connection "";
    }

    location ~ ^/__(publish|preview|unpublish|article|build|refresh)(/|$) {
        return 403;
    }

    location / {
        auth_request /__live_edit_auth;
        error_page 401 = @live_edit_denied;
        proxy_pass http://site_edit;
    }

    location @live_edit_denied {
        default_type text/plain;
        return 401 "This is the website's editing view. Open it from the Live editor at https://app.anahon.org/?door=live (website editors only).\n";
    }

    access_log /var/log/nginx/app.anahon.org-live-edit.access.log;
    error_log  /var/log/nginx/app.anahon.org-live-edit.error.log;
}
