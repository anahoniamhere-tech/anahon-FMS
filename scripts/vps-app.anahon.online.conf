# app.anahon.online — the staff door to the FMS (decided 11 Sep 2026, memory anahon-direct-signin-door).
# Lives on the KVM 2 at /etc/nginx/sites-available/app.anahon.online.
# Public HTTPS here; the FMS stays on the NAS and is reached over Tailscale only — this box is
# tag:door on the tailnet and the policy lets it reach anahon-1 tcp:3100 and nothing else.
# No basic auth (unlike anahon.online): the FMS has its own Google sign-in.

limit_req_zone  $binary_remote_addr zone=fms_api:10m    rate=20r/s;
limit_req_zone  $binary_remote_addr zone=fms_upload:10m rate=20r/m;
limit_conn_zone $binary_remote_addr zone=fms_conn:10m;

upstream fms {
    server 100.91.229.30:3100;    # anahon-1 over the tailnet
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name app.anahon.online;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }   # certbot --webroot renews here
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.anahon.online;

    ssl_certificate     /etc/letsencrypt/live/app.anahon.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.anahon.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    server_tokens off;

    # A rate counts requests, not bytes: a 250 MB upload is one request holding one connection.
    limit_req_status  429;
    limit_conn_status 429;
    limit_conn fms_conn 30;

    # Uploads stream through to the NAS as they arrive — nothing is spooled on this disk.
    # 600 s everywhere: a phone on 4G needs minutes for a video, and the AI routes answer slowly.
    client_max_body_size    300m;
    client_body_timeout     600s;
    proxy_request_buffering off;
    proxy_connect_timeout   10s;
    proxy_send_timeout      600s;
    proxy_read_timeout      600s;
    send_timeout            600s;

    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    # Overwrite, never append: the FMS takes this hop's word for who the visitor is (TRUST_PROXY),
    # and that is what keeps the private-network feeds closed to the internet.
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto https;

    location / {
        proxy_pass http://fms;
    }
    location /api/ {
        limit_req zone=fms_api burst=60 nodelay;
        proxy_pass http://fms;
    }
    location ~ ^/api/(document/upload|social/media)$ {
        limit_req zone=fms_upload burst=10 nodelay;
        proxy_pass http://fms;
    }

    access_log /var/log/nginx/app.anahon.online.access.log;
    error_log  /var/log/nginx/app.anahon.online.error.log;
}
