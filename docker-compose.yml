# AnaHon FMS on TrueNAS SCALE.  See DEPLOY-TRUENAS.md.
services:
  fms:
    build: .
    container_name: anahon-fms
    restart: unless-stopped
    ports:
      - "3100:3100"
    env_file: .env            # GEMINI_API_KEY, ANTHROPIC_API_KEY, FIREBASE_PROJECT_ID — never on the SMB share
    environment:
      # The office runs on Beirut time; without this the container is UTC and "today" turns over at 03:00.
      TZ: Asia/Beirut
      # FMS_PUBLIC_URL lives in .env (6 Sep 2026). It was set here, and a value in
      # `environment:` overrides `env_file:` — so setting it in .env while this line stood
      # changed nothing at all. It is the address the system hands out to phones (reminder
      # bodies, the desk feed, the "open on your phone" QR), so it must be reachable off
      # the office LAN and be a Firebase-authorized domain: the tailnet HTTPS door.
      ARCHIVE_DIR: /data/archive
      SITE_DIR: /data/site
      ANNA_TRAIN_DIR: /data/anna-training
    volumes:
      - ${FMS_DATA:-/mnt/mainpool/anahon/fms}/db:/data/db
      - ${FMS_DATA:-/mnt/mainpool/anahon/fms}/vault:/data/vault
      # Quotation share links. The FMS writes <token>.pdf here with its mtime set to
      # the quotation's validity expiry, and deletes it to revoke. A syncer on the NAS
      # host mirrors this directory to the VPS, so the FMS itself holds no deploy key
      # and never runs ssh or rsync. See system/QUOTATION-LINKS.md.
      - ${FMS_DATA:-/mnt/mainpool/anahon/fms}/quote-outbox:/data/quote-outbox
      # Saad's test-set correction screen (Anna learns Arabic, plan §B2); separate from vault.
      - ${ANNA_TRAIN_DATA:-/mnt/mainpool/anahon/anna-training}:/data/anna-training
      - ${FMS_DATA:-/mnt/mainpool/anahon/fms}/calendar-feed.json:/app/dist/.calendar-feed.json:ro
      # the archive is curated HERE now (3 Sep 2026): overrides are written, the library is rebuilt,
      # and the site's data folders receive the result. Site paths mirror the site repo layout.
      - ${ARCHIVE_DATA:-/mnt/mainpool/anahon/archive}:/data/archive
      - ${SITE_DATA:-/mnt/mainpool/anahon/site}/data:/data/site/src/data
      - ${SITE_DATA:-/mnt/mainpool/anahon/site}/images:/data/site/public/images
      - ${SITE_DATA:-/mnt/mainpool/anahon/site}/content:/data/site/src/content:ro
      - ${SITE_DATA:-/mnt/mainpool/anahon/site}/uploads:/data/site/public/uploads
    shm_size: 512m            # chromium PDF rendering
